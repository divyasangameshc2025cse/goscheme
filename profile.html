<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | GO SCHEME</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <header class="header-nav">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/></svg>
        <span>GO SCHEME</span>
      </a>

      <nav class="nav-links">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="eligible-schemes.html" class="nav-link">Eligible Schemes</a>
        <a href="explore-schemes.html" class="nav-link">Explore All</a>
        <a href="profile.html" class="nav-link active">Profile</a>
      </nav>

      <div class="nav-actions" id="header-user-nav">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem; max-width: 900px;">
      <div class="card" style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1.5rem; padding: 2rem;">
        <div style="width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--royal-blue), var(--teal)); color: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800;">
          A
        </div>
        <div>
          <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--primary-navy);" id="profile-display-name">Ananya Sundaram</h1>
          <p style="color: var(--text-secondary); font-size: 0.95rem;" id="profile-display-meta">22 Yrs Old • Chennai, Tamil Nadu</p>
          <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
            <span class="badge badge-tn">Tamil Nadu Resident</span>
            <span class="badge badge-eligible">Profile Verified</span>
          </div>
        </div>
        <div style="margin-left: auto;">
          <a href="profile-setup.html" class="btn btn-outline btn-sm">Launch 4-Step Wizard</a>
        </div>
      </div>

      <div class="card" style="padding: 2.5rem;">
        <h2 style="font-size: 1.3rem; font-weight: 700; color: var(--primary-navy); margin-bottom: 1.5rem;">Edit Citizen Profile Information</h2>

        <form id="user-profile-edit-form">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="profile-name">Full Name</label>
              <input type="text" id="profile-name" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-email">Email Address</label>
              <input type="email" id="profile-email" class="form-control" readonly style="background: var(--bg-main);">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="profile-phone">Mobile Number</label>
              <input type="text" id="profile-phone" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-district">District</label>
              <select id="profile-district" class="form-control form-select">
                <option value="Chennai">Chennai</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Madurai">Madurai</option>
                <option value="Salem">Salem</option>
                <option value="Tiruchirappalli">Tiruchirappalli</option>
                <option value="Thanjavur">Thanjavur</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="profile-income">Annual Income (₹)</label>
              <input type="number" id="profile-income" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-occupation">Occupation</label>
              <select id="profile-occupation" class="form-control form-select">
                <option value="Student">Student</option>
                <option value="Farmer">Farmer</option>
                <option value="Self-Employed">Self-Employed</option>
                <option value="Unemployed">Unemployed</option>
              </select>
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
              <label class="form-label" for="profile-education">Educational Qualification</label>
              <select id="profile-education" class="form-control form-select">
                <option value="High School">High School</option>
                <option value="Diploma">Diploma / ITI</option>
                <option value="Undergraduate">Undergraduate</option>
                <option value="Postgraduate">Postgraduate</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-caste">Community Category</label>
              <select id="profile-caste" class="form-control form-select">
                <option value="BC">BC</option>
                <option value="MBC">MBC</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="General">General</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 1rem;">Save Profile Changes</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 GO SCHEME Tamil Nadu Portal.</div>
      <a href="admin/login.html" style="color: var(--teal); font-weight: 600;">Admin Portal</a>
    </div>
  </footer>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
