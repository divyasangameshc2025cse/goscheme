<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | GO SCHEME Portal</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div class="auth-page-wrapper" style="background: var(--primary-navy);">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="brand-logo" style="justify-content: center; color: var(--primary-navy);">
          <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/></svg>
          <span>GO SCHEME ADMIN</span>
        </a>
        <h1 class="auth-title">Administrative Portal</h1>
        <p class="auth-subtitle">Secure management portal for Tamil Nadu scheme discovery</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="adminEmail">Admin Email ID</label>
          <input type="email" id="adminEmail" class="form-control" value="admin@tn.goscheme.gov.in" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="adminPassword">Master Security Password</label>
          <input type="password" id="adminPassword" class="form-control" value="admin123" placeholder="••••••••" required>
          <span class="form-hint">Default passcode: <strong>admin123</strong></span>
        </div>

        <button type="submit" class="btn btn-teal btn-block btn-lg" style="margin-top: 1rem;">Authenticate & Open Dashboard &rarr;</button>
      </form>

      <div class="auth-footer" style="margin-top: 2rem;">
        <a href="../index.html" style="color: var(--text-muted); font-size: 0.85rem;">&larr; Return to Citizen Portal</a>
      </div>
    </div>
  </div>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
