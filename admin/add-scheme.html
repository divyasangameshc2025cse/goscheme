<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Scheme | GO SCHEME Admin</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

  <header class="admin-header-bar">
    <a href="../index.html" class="brand-logo" style="color: white;">
      <svg viewBox="0 0 40 40" fill="none" width="32" height="32"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/></svg>
      <span>GO SCHEME ADMIN</span>
    </a>

    <div style="display: flex; gap: 1rem; align-items: center;">
      <a href="dashboard.html" class="admin-nav-link">Overview</a>
      <a href="manage-schemes.html" class="admin-nav-link">Manage Schemes</a>
      <a href="add-scheme.html" class="admin-nav-link active">+ Add New Scheme</a>
      <a href="login.html" class="btn btn-danger btn-sm" style="margin-left: 1rem;">Logout</a>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">
      <div class="admin-form-card">
        <div style="margin-bottom: 2rem;">
          <h1 style="font-size: 1.75rem; font-weight: 800; color: var(--primary-navy);">Add New Government Welfare Scheme</h1>
          <p style="color: var(--text-secondary); font-size: 0.95rem;">Enter eligibility parameters to publish a new scheme for Tamil Nadu citizens</p>
        </div>

        <form id="admin-add-scheme-form">
          <div class="form-group">
            <label class="form-label" for="schemeTitle">Scheme Official Title</label>
            <input type="text" id="schemeTitle" class="form-control" placeholder="e.g. TN Chief Minister's Skill Apprenticeship Grant" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="schemeDepartment">Issuing Department / Nodal Agency</label>
            <input type="text" id="schemeDepartment" class="form-control" placeholder="e.g. Dept of Labour Welfare & Skill Development, Tamil Nadu" required>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="schemeLevel">Government Jurisdiction Level</label>
              <select id="schemeLevel" class="form-control form-select">
                <option value="Tamil Nadu" selected>Tamil Nadu State</option>
                <option value="Central">Central Government</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="schemeCategory">Scheme Category</label>
              <select id="schemeCategory" class="form-control form-select">
                <option value="Education & Employment" selected>Education & Employment</option>
                <option value="Women & Child Welfare">Women & Child Welfare</option>
                <option value="Scholarship">Scholarship</option>
                <option value="Agriculture & Farmers">Agriculture & Farmers</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Housing">Housing</option>
                <option value="Entrepreneurship & Loans">Entrepreneurship & Loans</option>
              </select>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="schemeMinAge">Minimum Eligible Age</label>
              <input type="number" id="schemeMinAge" class="form-control" value="18" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="schemeMaxAge">Maximum Eligible Age</label>
              <input type="number" id="schemeMaxAge" class="form-control" value="35" required>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="schemeGender">Gender Eligibility</label>
              <select id="schemeGender" class="form-control form-select">
                <option value="All" selected>All Genders</option>
                <option value="Female">Female Only</option>
                <option value="Male">Male Only</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="schemeIncomeCap">Annual Income Cap (₹)</label>
              <input type="number" id="schemeIncomeCap" class="form-control" value="250000" required>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="schemeEducation">Target Qualification</label>
              <select id="schemeEducation" class="form-control form-select">
                <option value="Undergraduate" selected>Undergraduate</option>
                <option value="High School">High School (6-12)</option>
                <option value="Diploma">Diploma / ITI</option>
                <option value="Postgraduate">Postgraduate</option>
                <option value="All">All Qualifications</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="schemeOccupation">Target Occupation</label>
              <select id="schemeOccupation" class="form-control form-select">
                <option value="Student" selected>Student</option>
                <option value="Unemployed">Unemployed</option>
                <option value="Farmer">Farmer</option>
                <option value="Self-Employed">Self-Employed</option>
                <option value="All">All Occupations</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="schemeBenefits">Financial / Material Benefit Summary</label>
            <input type="text" id="schemeBenefits" class="form-control" placeholder="e.g. ₹2,500 monthly stipend during training period" required>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="schemeDeadline">Application Deadline Date</label>
              <input type="date" id="schemeDeadline" class="form-control" value="2026-12-31" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="schemeOfficialUrl">Official Government Application URL</label>
              <input type="url" id="schemeOfficialUrl" class="form-control" value="https://www.tn.gov.in" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="schemeDescription">Full Scheme Overview & Objective</label>
            <textarea id="schemeDescription" class="form-control" rows="3" placeholder="Enter detailed scheme description..." required>Initiative designed to support eligible citizens across Tamil Nadu with financial stipend and career placement opportunities.</textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="schemeDocuments">Required Checklist Documents (Comma Separated)</label>
            <input type="text" id="schemeDocuments" class="form-control" value="Aadhaar Card, Income Certificate, Bank Passbook, Educational Certificate" required>
          </div>

          <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn btn-teal btn-lg">Publish Scheme to Portal &rarr;</button>
            <a href="manage-schemes.html" class="btn btn-outline btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/mock-data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
