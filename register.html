<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | GO SCHEME</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header-nav">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#brand-grad)"/>
          <path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/>
          <path d="M20 21L23 28H17L20 21Z" fill="#14B8A6"/>
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0F172A"/>
              <stop offset="1" stop-color="#2563EB"/>
            </linearGradient>
          </defs>
        </svg>
        <span>GO SCHEME</span>
        <span class="brand-tagline-sm">TN Edition</span>
      </a>

      <nav class="nav-links" id="main-nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore-schemes.html" class="nav-link">Explore Schemes</a>
        <a href="eligible-schemes.html" class="nav-link">Check Eligibility</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="saved-schemes.html" class="nav-link">Saved Schemes</a>
      </nav>

      <div class="nav-actions" id="header-user-nav">
        <!-- Rendered dynamically via js/app.js -->
      </div>

      <button class="mobile-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create Citizen Profile</h1>
        <p class="auth-subtitle">Discover government welfare schemes tailored to your exact criteria</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name (As per Aadhaar)</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Ananya Sundaram" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Mobile Number (Aadhaar Linked)</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Create Account & Setup Profile &rarr;</button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html" style="font-weight: 700;">Log In</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
