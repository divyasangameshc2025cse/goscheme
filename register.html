<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | GO SCHEME</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center;">
          <svg viewBox="0 0 40 40" fill="none" width="36" height="36"><rect width="40" height="40" rx="10" fill="#2563EB"/><path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/></svg>
          <span>GO SCHEME</span>
        </a>
        <h1 class="auth-title">Create Citizen Profile</h1>
        <p class="auth-subtitle">Discover government welfare schemes tailored to your exact criteria</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="fullName">Full Name (As per Aadhaar)</label>
          <input type="text" id="fullName" class="form-control" placeholder="e.g. Ananya Sundaram" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Mobile Number (Aadhaar Linked)</label>
          <input type="tel" id="phone" class="form-control" placeholder="+91 98765 43210" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Create Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 8 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Create Account & Setup Profile &rarr;</button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="login.html" style="font-weight: 700;">Log In</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
