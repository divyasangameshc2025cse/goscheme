<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | GO SCHEME</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <!-- Navigation Bar -->
  <header class="header-nav">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="40" height="40" rx="10" fill="url(#brand-grad)"/>
          <path d="M12 28L20 12L28 28H23L20 21L17 28H12Z" fill="white"/>
          <path d="M20 21L23 28H17L20 21Z" fill="#14B8A6"/>
          <defs>
            <linearGradient id="brand-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#0F172A"/>
              <stop offset="1" stop-color="#2563EB"/>
            </linearGradient>
          </defs>
        </svg>
        <span>GO SCHEME</span>
        <span class="brand-tagline-sm">TN Edition</span>
      </a>

      <nav class="nav-links" id="main-nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore-schemes.html" class="nav-link">Explore Schemes</a>
        <a href="eligible-schemes.html" class="nav-link">Check Eligibility</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="saved-schemes.html" class="nav-link">Saved Schemes</a>
      </nav>

      <div class="nav-actions" id="header-user-nav">
        <!-- Rendered dynamically via js/app.js -->
      </div>

      <button class="mobile-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </header>

  <div class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to view your matched Tamil Nadu & Central schemes</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email or Mobile Number</label>
          <input type="email" id="email" class="form-control" placeholder="e.g. ananya.sundaram@example.com" value="ananya.sundaram@example.com" required>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="password">Password</label>
            <a href="#" style="font-size: 0.8rem; font-weight: 600;">Forgot password?</a>
          </div>
          <input type="password" id="password" class="form-control" placeholder="••••••••" value="password123" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem;">Log In to Portal &rarr;</button>
      </form>

      <div class="auth-divider">
        <span>Quick Demo Login</span>
      </div>

      <button onclick="document.getElementById('email').value='ananya.sundaram@example.com'; document.getElementById('password').value='password123'; document.getElementById('login-form').dispatchEvent(new Event('submit'));" class="btn btn-outline btn-block btn-sm">
        Log In as Mock Student Profile (Ananya)
      </button>

      <div class="auth-footer">
        Don't have a profile yet? <a href="register.html" style="font-weight: 700;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
